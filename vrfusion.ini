# VRFusion 0.5
# Normal use is one-click: run VRFusion.exe before starting the VR game.
# VRFusion registers the per-user OpenXR layer and selects the backend automatically.
# Press R in a visible backend window only when debugging runtime-safe values.

width=1920
height=1080
fps=60

# fusion | left | right | sbs
mode=fusion

# Crop into the dual-eye source while preserving a real perspective aspect ratio.
# 1.00 = maximum usable FOV; 1.05-1.15 gives stabilization margin.
zoom=1.08

# Half-width of the stereo seam in tangent-FOV units.
feather=0.020

# Higher values harden the seam around pixels where the eyes disagree strongly,
# reducing close-object double images. 0 disables adaptive hardening.
seam_contrast=4.0

# Rotation-only spectator stabilization.
stabilization=1
stabilization_ms=75
max_stabilization_deg=7

# Preview / diagnostics.
show_fps=1
vsync=0

# OpenXR depth-viewer quality. Ignored by the SteamVR fallback.
openxr_mesh_step=3
openxr_depth_discontinuity_ratio=1.25
